name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build offline web bundle
        run: npm run build:www

      - name: Generate Android project
        run: |
          npx cap add android
          node scripts/prepare-android.mjs
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Tudo.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tudo-apk
          path: Tudo.apk
          retention-days: 30

      - name: Publish release (used by the download page)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Tudo 1.0.${{ github.run_number }}
          body: Android build from commit ${{ github.sha }}. Install Tudo.apk on your phone.
          files: Tudo.apk
          make_latest: true
