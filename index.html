<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tudo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F8FA; --panel:#FFFFFF; --side:#FFFFFF; --rail:#F6F8FA; --ink:#121314; --ink2:#3A3B3E; --ink3:#888A8C;
  --line:#EDEFF1; --hover:#F1F3F5; --sel:#EEF1FD; --accent:#2740CB; --accentInk:#FFFFFF;
  --p3:#D75054; --p2:#FBA21B; --p1:#3450DA; --p0:#A9ACB1; --over:#D75054;
  --shadow:0 10px 30px rgba(18,19,20,.12);
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#020617; --panel:#0F172A; --side:#0F172A; --rail:#020617; --ink:#F1F5F9; --ink2:#CBD5E1; --ink3:#64748B;
    --line:#1E293B; --hover:#1E293B; --sel:color-mix(in srgb,var(--accent) 16%,var(--panel)); --accent:#22D3EE; --accentInk:#04121A;
    --p3:#F87171; --p2:#FBBF24; --p1:#60A5FA; --p0:#475569; --over:#F87171; --shadow:0 10px 30px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#020617; --panel:#0F172A; --side:#0F172A; --rail:#020617; --ink:#F1F5F9; --ink2:#CBD5E1; --ink3:#64748B;
  --line:#1E293B; --hover:#1E293B; --sel:color-mix(in srgb,var(--accent) 16%,var(--panel)); --accent:#22D3EE; --accentInk:#04121A;
  --p3:#F87171; --p2:#FBBF24; --p1:#60A5FA; --p0:#475569; --over:#F87171; --shadow:0 10px 30px rgba(0,0,0,.55);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13.5px/1.5 var(--font);display:flex;flex-direction:column;font-feature-settings:'cv11','ss01';letter-spacing:-.005em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
::selection{background:#DEE3FA;color:#121314}
.when,.n,.evm,.streak,.hrs span,.big,.stat b{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr) auto;flex:1;min-height:0;overflow:hidden}
body.unpinned .app{grid-template-columns:minmax(0,1fr) auto}
body.unpinned #side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:42;transform:translateX(-102%);transition:transform .2s ease;box-shadow:var(--shadow)}
body.unpinned #side.open{transform:none}
#topnav .tn-menu{display:none}
body.unpinned #topnav .tn-menu{display:grid}
.sidehead{display:flex;align-items:center;justify-content:space-between;padding:2px 14px 6px 18px;font-size:11.5px;font-weight:600;color:var(--ink3)}
.pinbtn{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--ink3)}
.pinbtn:hover{background:var(--hover);color:var(--ink)}
.pinbtn.on{color:var(--accent)}
/* top navigation (StoryLine style) */
#topnav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 24px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:30}
.tn-l,.tn-r{display:flex;align-items:center;gap:12px;min-width:0}
.tn-l{gap:24px}
.tn-brand{display:flex;align-items:center;gap:10px}
.tn-brand .mark{width:32px;height:32px;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tn-brand b{font-size:16px;font-weight:800;letter-spacing:-.025em;color:var(--ink)}
.kpill{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;font-size:12px;color:var(--ink3);white-space:nowrap}
.kpill:hover{border-color:var(--ink3)}
.kpill:focus-within{border-color:var(--accent);background:var(--panel)}
.kpill input{border:0;background:none;outline:none;width:170px;font-size:12px;color:var(--ink)}
.kpill kbd{margin-left:14px;padding:1px 6px;font:10px/1.5 var(--mono);background:var(--panel);border:1px solid var(--line);border-radius:4px;color:var(--ink3)}
.tn-tabs{display:flex;align-items:center;gap:4px}
.tn-tabs button{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap}
.tn-tabs button svg{width:14px;height:14px}
.tn-tabs button:hover{color:var(--ink)}
.tn-tabs button.on{background:var(--line);color:var(--accent);font-weight:700}
.tbtn{padding:6px;border-radius:8px;background:var(--bg);border:1px solid var(--line);color:var(--ink3);display:grid;place-items:center}
.tbtn:hover{background:var(--hover);color:var(--ink2)}
.tbtn svg{width:16px;height:16px}
.cta{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;background:var(--accent);color:var(--accentInk);font-size:12px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1);white-space:nowrap}
.cta:hover{filter:brightness(1.08)}
.cta svg{width:14px;height:14px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--sel);color:var(--accent);font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
.acct{padding:8px 10px 4px;font-size:12.5px;color:var(--ink2);line-height:1.4}
.acct b{display:block;color:var(--ink);font-size:13px}
.gqr img{width:100%;height:100%}
.eyebrow{display:flex;align-items:center;gap:7px;color:var(--accent);font-size:12px;font-weight:600;margin-bottom:4px}
.eyebrow svg{width:15px;height:15px}

/* sidebar */
#side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-top:12px}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 10px}
.brand b{font-size:19px;font-weight:700;letter-spacing:-.01em}
.mark{width:30px;height:30px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accentInk)}
.views{display:flex;gap:2px;padding:6px 12px 10px}
.views button{flex:1;display:grid;place-items:center;height:38px;border-radius:9px;color:var(--ink2)}
.views button:hover{background:var(--hover)}
.views button.on{background:var(--panel);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.search{margin:0 14px 8px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:0 10px;height:36px;color:var(--ink3)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;color:var(--ink)}
.navscroll{overflow-y:auto;flex:1;padding:4px 10px 12px}
.sec{display:flex;align-items:center;justify-content:space-between;padding:14px 8px 4px;color:var(--ink3);font-size:11.5px;font-weight:600}
.sec button{color:var(--ink3);width:24px;height:24px;border-radius:6px;display:grid;place-items:center}
.sec button:hover{background:var(--hover);color:var(--ink)}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border-radius:8px;color:var(--ink2);text-align:left;font-size:13px;font-weight:500}
.nav svg{width:16px;height:16px}
.nav:hover{background:var(--hover)}
.nav.on{background:var(--sel);color:var(--accent);color:var(--ink);font-weight:600}
.nav.drop{outline:2px dashed var(--accent)}
.nav .n{margin-left:auto;font-size:12.5px;color:var(--ink3);font-weight:500}
.nav .dot{width:10px;height:10px;border-radius:3px;flex:none;margin:0 3px}
.nav .emo{width:16px;text-align:center;flex:none;font-size:15px;line-height:1}
.nav .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidefoot{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink3)}
.sidefoot button{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink2)}
.sidefoot button:hover{background:var(--hover)}

/* main */
#main{background:var(--bg);min-width:0;display:flex;flex-direction:column;min-height:0}
.head{display:flex;align-items:flex-end;gap:16px;padding:22px 24px 16px;margin:0 0 12px;border-bottom:1px solid var(--line)}
.head h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.02em;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.head .sub{color:var(--ink2);opacity:.75;font-size:13px;margin-top:4px;max-width:640px}
.head .grow{flex:1;min-width:0}
.iconbtn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink2)}
.iconbtn:hover{background:var(--hover)}
.menu-btn{display:none}
.body{overflow-y:auto;flex:1;padding:0 24px 40px}
.tasks-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px 10px}
.add{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:0 12px;height:44px;margin:10px 0 6px;background:var(--panel);color:var(--ink3)}
.add:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
.add input{flex:1;min-width:0;border:0;outline:none;background:none}
.hint{font-size:12.5px;color:var(--ink3);margin:0 2px 10px}
.hint code{font-family:inherit;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.grp{display:flex;align-items:center;gap:8px;margin:14px 6px 4px;font-weight:600;font-size:13px;color:var(--ink)}
.grp .c{color:var(--ink3);font-weight:500;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:0 7px;font-size:11.5px}
.grp.over{color:var(--over)}
.grp button{display:flex;align-items:center;gap:6px;color:inherit;font-weight:inherit}
.grp{margin-top:20px}
.grp button svg{color:var(--ink3)}
.task{display:flex;align-items:center;gap:12px;padding:0 10px;border-radius:9px;cursor:pointer;position:relative;min-height:44px}
.task .tline{flex:1;min-width:0;align-self:stretch;display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.task:hover .tline,.task.on .tline{border-bottom-color:transparent}
.when{flex:none;font-size:13px;color:var(--accent);font-variant-numeric:tabular-nums;align-self:center}
.when.od{color:var(--over)}
.done .when{color:var(--ink3)}
.task:hover{background:var(--hover)}
.task.on{background:var(--sel)}
.task.done .tt{color:var(--ink3);text-decoration:line-through}
.chk{flex:none;width:18px;height:18px;border-radius:4px;border:2px solid var(--p0);display:grid;place-items:center;color:transparent}
.chk.p3{border-color:var(--p3)} .chk.p2{border-color:var(--p2)} .chk.p1{border-color:var(--p1)}
.chk:hover{background:var(--hover)}
.done .chk{background:var(--p0);border-color:var(--p0);color:#fff}
.tmain{flex:1;min-width:0}
.tt{word-break:break-word;font-size:13.5px;color:var(--ink)}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px;font-size:12.5px;color:var(--ink3)}
.meta .od{color:var(--over)} .meta .td{color:var(--accent)}
.tag{background:var(--bg);border:1px solid var(--line);padding:0 6px;border-radius:5px}
.flag{flex:none}
.empty{padding:50px 10px;text-align:center;color:var(--ink3)}
.empty b{display:block;color:var(--ink2);font-size:16px;margin-bottom:4px}

/* detail */
#detail{width:0;overflow:hidden;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#detail.open{width:400px}
.dtop{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dwhen{flex:1;min-width:0;color:var(--accent);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dwhen.none{color:var(--ink3)}
.emojis{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.emojis button{width:32px;height:32px;border-radius:8px;font-size:17px;display:grid;place-items:center}
.emojis button.on{background:var(--hover);box-shadow:inset 0 0 0 1px var(--ink3)}
.mlabel{font-size:12.5px;color:var(--ink3);margin-top:14px}
.dbody{overflow-y:auto;flex:1;padding:16px 20px 30px}
.dtitle{width:100%;border:0;outline:none;background:none;font-size:20px;font-weight:600;resize:none;padding:0;line-height:1.3}
.field{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:8px;margin:10px 0}
.field label{font-size:13px;color:var(--ink3)}
.field input,.field select,.notes{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 9px;min-width:0;width:100%}
.prio{display:flex;gap:4px}
.prio button{flex:1;min-width:0;height:32px;border-radius:8px;border:1px solid var(--line);font-size:12px;padding:0 4px;display:flex;align-items:center;justify-content:center;gap:5px}
.prio button.on{border-color:currentColor;font-weight:600}
.notes{min-height:110px;resize:vertical;margin-top:4px;line-height:1.5}
.subs{margin-top:18px}
.subs h3{font-size:13px;color:var(--ink3);font-weight:600;margin:0 0 6px}
.sub-i{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.sub-i input[type=text]{flex:1;border:0;background:none;outline:none;min-width:0}
.sub-i.d input[type=text]{text-decoration:line-through;color:var(--ink3)}
.sub-i .x{opacity:0;color:var(--ink3)} .sub-i:hover .x{opacity:1}
.subadd{display:flex;align-items:center;gap:10px;padding:5px 0;color:var(--ink3)}
.subadd input{flex:1;border:0;background:none;outline:none;min-width:0}
.dfoot{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink3)}
.danger{color:var(--over);padding:6px 10px;border-radius:8px}
.danger:hover{background:var(--hover)}
.btn{background:var(--accent);color:var(--accentInk);padding:8px 14px;border-radius:8px;font-weight:600;font-size:13.5px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--hover);filter:none}

/* calendar */
.ev{--c:#6B7280;background:color-mix(in srgb,var(--c) 30%,var(--panel));border-left:3px solid var(--c);color:var(--ink)}
.ev.done{opacity:.55}
.ev.done .evt{text-decoration:line-through}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{padding:5px 12px;border-radius:7px;font-size:13.5px;color:var(--ink2)}
.seg button.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.wk{flex:1;min-height:0;display:flex;flex-direction:column;margin:0 24px 20px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.wkrow{display:grid;grid-template-columns:56px repeat(var(--cols),minmax(0,1fr))}
.wkhead{border-bottom:1px solid var(--line)}
.wkhead div{text-align:center;padding:10px 4px 8px;font-size:12.5px;color:var(--ink3)}
.wkhead b{display:inline-grid;place-items:center;min-width:30px;height:30px;border-radius:15px;font-size:17px;color:var(--ink);font-weight:600;margin-top:2px}
.wkhead .today b{background:var(--accent);color:var(--accentInk)}
.allday{border-bottom:1px solid var(--line);min-height:34px}
.allday>div{border-left:1px solid var(--line);padding:3px;min-width:0}
.allday>div:first-child{border-left:0;font-size:11px;color:var(--ink3);padding:9px 6px 0;text-align:right}
.allday .drop{background:var(--sel)}
.adchip{display:block;font-size:12px;padding:2px 7px;margin:2px 0;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.wkscroll{flex:1;overflow-y:auto;min-height:0}
.wkgrid{position:relative}
.hrs{position:relative}
.hrs span{position:absolute;right:8px;font-size:11px;color:var(--ink3);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.dcol{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hr) - 1px),var(--line) calc(var(--hr) - 1px),var(--line) var(--hr));cursor:copy}
.dcol.wkend{background-color:color-mix(in srgb,var(--bg) 55%,transparent)}
.dcol.drop{background-color:var(--sel)}
.blk{position:absolute;border-radius:8px;padding:5px 8px;overflow:hidden;cursor:pointer;font-size:12.5px;line-height:1.3;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.blk:hover{filter:saturate(1.15) brightness(.98);z-index:3}
.blk.on{box-shadow:0 0 0 2px var(--c);z-index:4}
.blk .evt{font-weight:600;font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.blk .evm{color:var(--ink2);font-size:11.5px;font-variant-numeric:tabular-nums}
.blk .rz{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--over);z-index:5;pointer-events:none}
.nowline:before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--over)}
.slotpop{padding:10px;width:280px}
.slotpop input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);outline:none}
.slotpop input:focus{border-color:var(--accent)}
.slotpop div{font-size:12.5px;color:var(--ink3);margin:0 2px 6px}
.cswatch{display:flex;flex-wrap:wrap;gap:6px}
.cswatch button{width:24px;height:24px;border-radius:7px}
.cswatch button.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
.cswatch .auto{border:1px dashed var(--ink3);font-size:10px;color:var(--ink3);width:auto;padding:0 6px}
.calbar{display:flex;align-items:center;gap:6px}
.calwrap{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;flex:1;min-height:0;padding:0 24px 24px}
.cal{background:var(--panel);display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:auto;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:0;align-content:stretch}
.cal .dow{padding:8px;font-size:12.5px;color:var(--ink3);font-weight:600;background:var(--bg);border-bottom:1px solid var(--line)}
.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:96px;padding:5px;cursor:pointer;min-width:0}
.cell:nth-child(7n){border-right:0}
.cell.out{background:var(--bg);color:var(--ink3)}
.cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cell.drop{background:var(--sel)}
.cell .d{font-size:12.5px;font-weight:600;display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:12px}
.cell.today .d{background:var(--accent);color:var(--accentInk)}
.chip{display:block;font-size:12px;padding:2px 6px;margin-top:3px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.done{text-decoration:line-through;opacity:.55}
.more{font-size:11.5px;color:var(--ink3);padding-left:4px}
.agenda{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;overflow-y:auto;min-height:0}
.agenda h2{margin:0;font-size:16px}

/* matrix */
.matrix{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(260px,1fr);gap:14px;padding:0 24px 24px;flex:1;overflow-y:auto}
.quad{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.quad.drop{outline:2px dashed var(--accent)}
.quad header{padding:12px 14px 6px;display:flex;align-items:baseline;gap:8px}
.quad header b{font-size:14.5px}
.quad header span{font-size:12.5px;color:var(--ink3)}
.quad .qb{overflow-y:auto;flex:1;padding:0 6px 6px}
.quad .add{margin:4px 8px 10px;height:38px}

/* focus */
.focus{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;padding:0 24px 24px;flex:1;overflow-y:auto}
.timer{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px}
.modes{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.modes button{padding:6px 16px;border-radius:8px;color:var(--ink2);font-weight:500}
.modes button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ring{position:relative;width:min(300px,70vw);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .big{font-size:clamp(44px,9vw,64px);font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.ring .lbl{font-size:13px;color:var(--ink3);margin-top:6px}
.ctrls{display:flex;gap:10px}
.ctrls .btn{min-width:120px}
.stats{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;align-self:start}
.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.stat:last-of-type{border-bottom:0}
.stat b{font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:14px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:11px;color:var(--ink3)}
.bars i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 2px 2px;min-height:2px;opacity:.85}
.log{margin-top:14px;font-size:13px}
.log div{display:flex;justify-content:space-between;padding:4px 0;color:var(--ink2)}

/* habits */
.htable{width:100%;border-collapse:collapse;margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.htable th:first-child,.htable td:first-child{padding-left:16px}
.htable th{font-size:12px;color:var(--ink3);font-weight:600;padding:6px 4px;text-align:center}
.htable th:first-child{text-align:left}
.htable td{padding:8px 4px;border-top:1px solid var(--line);text-align:center}
.htable td:first-child{text-align:left;font-weight:500}
.hc{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:inline-grid;place-items:center;color:transparent}
.hc.on{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.hc:hover{border-color:var(--accent)}
.streak{font-variant-numeric:tabular-nums;color:var(--ink2)}
.tablewrap{overflow-x:auto}

/* toast + modal */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 14px;border-radius:10px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);z-index:50;font-size:14px}
.toast button{color:var(--panel);font-weight:600;text-decoration:underline}
.scrim{position:fixed;inset:0;background:rgba(10,15,20,.35);z-index:40;display:none}
.scrim.on{display:block}
.modal{max-height:84vh;overflow-y:auto;position:fixed;left:50%;top:8vh;transform:translateX(-50%);width:min(380px,92vw);background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:20px;z-index:45}
.modal h2{margin:0 0 12px;font-size:17px}
.modal input[type=text]{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--bg)}
.swatches{display:flex;gap:8px;margin:6px 0 16px}
.swatches button{width:26px;height:26px;border-radius:8px}
.swatches button.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
.mrow{display:flex;justify-content:space-between;gap:8px;margin-top:6px}
.ctx{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;z-index:46;min-width:150px}
.ctx button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:7px}
.ctx button:hover{background:var(--hover)}

/* clipboard */
.clipwrap{display:grid;grid-template-columns:280px minmax(0,1fr);flex:1;min-height:0;border:1px solid var(--line);border-radius:12px;margin:0 24px 20px;background:var(--panel);overflow:hidden}
.cliplist{overflow-y:auto;border-right:1px solid var(--line);padding:8px}
.clipi{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:9px;margin-bottom:2px}
.clipi:hover{background:var(--hover)}
.clipi.on{background:var(--sel)}
.clipi b{display:flex;align-items:center;font-weight:600;font-size:14.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.clipi span{display:block;color:var(--ink2);font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-family:var(--mono)}
.clipi small{display:block;color:var(--ink3);font-size:11.5px;margin-top:2px}
.pill{font-size:11px;font-weight:600;color:var(--accent);border:1px solid currentColor;border-radius:999px;padding:0 7px;margin-left:8px;flex:none;font-family:var(--font)}
.clipedit{display:flex;flex-direction:column;min-height:0;min-width:0;padding:14px 24px 16px}
.cbar{display:flex;gap:8px;align-items:center}
#ctitle{flex:1;border:0;background:none;font-size:19px;font-weight:600;outline:none;min-width:0;padding:4px 0}
#clang{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;font-size:13px}
.cbar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 12px}
.cbar2 .btn{padding:6px 12px;font-size:13.5px}
.cbar2 .grow{flex:1}
.editor{flex:1;min-height:260px;display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.editor:focus-within{border-color:var(--accent)}
.gutter{font-feature-settings:normal;margin:0;padding:12px 10px 12px 8px;text-align:right;color:var(--ink3);font:13px/1.6 var(--mono);user-select:none;overflow:hidden;min-width:46px;border-right:1px solid var(--line);white-space:pre}
#padtext{font-feature-settings:normal;letter-spacing:0;flex:1;min-width:0;border:0;outline:none;resize:none;background:none;padding:12px 14px;font:13px/1.6 var(--mono);tab-size:4;white-space:pre;overflow:auto;color:var(--ink)}
.cstat{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ink3);margin-top:8px}
#cpeers{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.peer{display:inline-flex;align-items:center;gap:5px}
.peer i{width:8px;height:8px;border-radius:50%;display:block}
.clipback{display:none}
.setpop{width:270px;padding:8px}
.setpop .swatches{flex-wrap:wrap;padding:0 6px;margin:4px 0 10px;align-items:center}
.setpop .swatches button{width:26px;height:26px;padding:0;flex:none;display:block;border-radius:8px}
.setpop .mlabel{margin:6px 6px 2px}
@media (max-width:820px){
  .clipwrap{grid-template-columns:minmax(0,1fr)}
  .clipwrap .clipedit{display:none;padding:10px 16px 16px}
  .clipwrap.editing .cliplist{display:none}
  .clipwrap.editing .clipedit{display:flex}
  .clipback{display:grid}
}
/* sign-in gate */
body.gated #topnav,body.gated .app,body.gated #layer>*:not(.toast){display:none!important}
#gate{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;display:flex;align-items:flex-start;justify-content:center;padding:max(6vh,24px) 16px 32px}
#gate.over{background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px)}
#gate[hidden]{display:none}
.gcard{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px 28px 24px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.gbrand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.gbrand .mark{width:32px;height:32px;border-radius:8px}
.gbrand b{font-size:16px;font-weight:800;letter-spacing:-.025em}
.gcard h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.02em}
.gsub{margin:6px 0 18px;color:var(--ink2);opacity:.8;font-size:13px}
.gfield{display:block;margin:12px 0}
.gfield span{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.gfield input{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--panel);outline:none;font-size:14px}
.gfield input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
.gfield input.code{font:600 18px/1 var(--mono);letter-spacing:.3em;text-align:center}
.gbtn{width:100%;height:40px;border-radius:8px;background:var(--accent);color:var(--accentInk);font-weight:600;font-size:13.5px;margin-top:8px}
.gbtn:hover{filter:brightness(1.08)}
.gbtn:disabled{opacity:.55;cursor:not-allowed;filter:none}
.gbtn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.glink{color:var(--accent);font-size:12.5px;font-weight:600;margin-top:14px;display:inline-block}
.gerr{color:var(--over);font-size:12.5px;min-height:18px;margin-top:8px}
.gcheck{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);margin:10px 0 4px}
.gqr{display:flex;gap:16px;align-items:center;margin:8px 0 6px}
.gqr .q{width:150px;height:150px;flex:none;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px}
.gqr .q svg{width:100%;height:100%}
.gsecret{font:500 12px/1.5 var(--mono);word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin-top:6px;color:var(--ink)}
.gcodes{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font:600 14px/1.6 var(--mono);text-align:center;margin:6px 0 4px}
.gmeter{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.gmeter i{display:block;height:100%;transition:width .2s}
.gfoot{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink3)}
@media (max-width:480px){.gqr{flex-direction:column;align-items:flex-start}.gcard{padding:22px 18px}}
/* alerts & alarms */
.seg2{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg2 button{flex:1;padding:5px 6px;border-radius:6px;font-size:12px;color:var(--ink2);white-space:nowrap}
.seg2 button.on{background:var(--panel);color:var(--accent);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.fhint{grid-column:2;font-size:11.5px;color:var(--ink3);margin-top:-4px}
.alist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.acard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.acard.off{opacity:.6}
.acard .atop{display:flex;align-items:center;gap:12px}
.acard .atime{font-size:30px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.acard .alabel{font-weight:600;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acard .asched{font-size:12.5px;color:var(--ink2)}
.acard .anext{font-size:12px;color:var(--accent);font-weight:600}
.acard .anext.done{color:var(--ink3)}
.acard .aact{display:flex;gap:6px;margin-top:4px}
.acard .aact button{font-size:12px;font-weight:600;padding:5px 10px;border-radius:7px;border:1px solid var(--line);background:var(--panel)}
.acard .aact button:hover{background:var(--hover)}
.sw{position:relative;width:38px;height:22px;border-radius:11px;background:var(--line);flex:none;transition:background .15s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.sw.on{background:var(--accent)}
.sw.on:after{left:19px}
.asec{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px;font-size:13px;font-weight:700}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--sel);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--ink);margin-bottom:14px}
.banner .grow{flex:1;min-width:200px}
.uplist{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.uprow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);font-size:13px;cursor:pointer}
.uprow:first-child{border-top:0}
.uprow:hover{background:var(--hover)}
.uprow .w{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600;min-width:120px}
.uprow .k{margin-left:auto;font-size:11.5px;color:var(--ink3)}
.daychips{display:flex;gap:4px;flex-wrap:wrap}
.daychips button{width:36px;height:30px;border-radius:7px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink2)}
.daychips button.on{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.mf{display:block;margin:10px 0}
.mf>span{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.mf input,.mf select{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--panel)}
.mrow2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.merr{color:var(--over);font-size:12.5px;min-height:18px}
#ring{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px}
#ring[hidden]{display:none}
.ringcard{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:28px;text-align:center}
.ringcard .rk{display:inline-flex;align-items:center;gap:6px;color:var(--over);font-size:12px;font-weight:700}
.ringcard .rt{font-size:64px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.05;margin:10px 0 6px}
.ringcard .rl{font-size:17px;font-weight:600;word-break:break-word}
.ringcard .rs{font-size:12.5px;color:var(--ink3);margin-top:4px}
.ringcard .rb{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.ringcard .rb button{height:44px;border-radius:10px;font-weight:700;font-size:14px}
.ringcard .rb .snz{background:var(--bg);border:1px solid var(--line)}
.ringcard .rb .dis{background:var(--over);color:#fff}
.ringcard .more{font-size:12px;color:var(--ink3);margin-top:12px}
@keyframes ringpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.ringcard .rt{animation:ringpulse 1.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.ringcard .rt{animation:none}}
#notes{position:fixed;top:64px;right:16px;z-index:70;display:flex;flex-direction:column;gap:8px;width:min(340px,calc(100vw - 32px))}
.ncard{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;box-shadow:var(--shadow);padding:10px 12px;font-size:13px}
.ncard b{display:block;font-size:13.5px}
.ncard .nm{color:var(--ink3);font-size:12px;margin-top:2px}
.ncard .na{display:flex;gap:8px;margin-top:8px}
.ncard .na button{font-size:12px;font-weight:600;color:var(--accent)}

.stats4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}

const priColor = p => ['var(--p0)', 'var(--p1)', 'var(--p2)', 'var(--p3)'][p || 0];

/* ---------- state ---------- */
function fresh() {
  const t = today(), work = uid(), personal = uid();
  const mk = (title, o = {}) => ({ id: uid(), title, notes: '', listId: 'inbox', due: null, time: null, pri: 0, tags: [], subs: [], done: false, doneAt: null, created: Date.now(), repeat: '', deleted: false, ...o });
  return {
    v: 4,
    lists: [{ id: 'inbox', name: 'Inbox', color: '#13A8B1', sys: true }, { id: work, name: 'Work', color: '#2740CB', icon: '💼' }, { id: personal, name: 'Personal', color: '#843CF3', icon: '🏠' }],
    tasks: [
      mk('Try quick add: Tmrw High New rule', { due: t, notes: 'Type the day, then the severity, then the task name. Day: Today, Tmrw, a weekday, or Next week. Severity: High, Med, or Low. You can also add a time (17:00), #tag, ^List, or every week.' }),
      mk('Drag a task onto a list in the sidebar to move it', { due: t, listId: work, pri: 2 }),
      mk('Open the calendar and drag tasks between days', { due: addDays(t, 1), listId: work, pri: 1, tags: ['tour'] }),
      mk('Set an alarm on the Alarms tab', { due: addDays(t, 2), listId: personal, subs: [{ id: uid(), t: 'Open Alarms', d: false }, { id: uid(), t: 'Choose New alarm', d: false }] }),
    ],
    habits: [{ id: uid(), name: 'Read 20 minutes', log: {} }, { id: uid(), name: 'Walk', log: {} }],
    focus: [],
    settings: { pomo: 25, brk: 5, theme: 'auto' }

}
/* ---------- encryption at rest ----------
   Once sign-in is set up, everything except the sign-in record and a few display settings is stored
   encrypted with AES-256-GCM. The data key is random; it is stored only wrapped (encrypted) with a key
   derived from your passphrase (PBKDF2-SHA256) and, separately, with each recovery code. */
const CFG = window.TUDO_CONFIG || {};
const SBMODE = !!(CFG.supabaseUrl && CFG.supabaseAnonKey); // accounts via Supabase (Vercel site and Android app)
const SB = { client: null, user: null, uid: null, lastSync: 0, dirty: false, recovery: false, email: '', retry: null, factorId: null };
const ENC = { raw: null, key: null, sealed: false };
let ENV = null; // encrypted envelope waiting to be opened
const PUB_SETTINGS = ['theme', 'accent', 'font', 'autoLock'];
const rand32 = () => crypto.getRandomValues(new Uint8Array(32));
async function setDEK(raw) { ENC.raw = raw; ENC.key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']); }

}

  const salt = b64e(crypto.getRandomValues(new Uint8Array(16))), kek = await kekFrom(secret, salt, iter);
  const iv = crypto.getRandomValues(new Uint8Array(12)), ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, kek, ENC.raw));
  return { salt, iter, iv: b64e(iv), ct: b64e(ct) };
}
async function unwrapDEK(secret, w) {
  try { const kek = await kekFrom(secret, w.salt, w.iter); return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(w.iv) }, kek, b64d(w.ct))); } catch (e) { return null; }
}
function emptyState(auth, pub) { return { v: 4, lists: [{ id: 'inbox', name: 'Inbox', color: '#13A8B1', sys: true }], tasks: [], habits: [], focus: [], alarms: [], settings: { pomo: 25, brk: 5, theme: 'auto', ...(pub || {}) }, auth }; }
function adoptStored(str) {
  const o = JSON.parse(str);
  if (o && o.enc) { ENV = o; ENC.sealed = true; S = emptyState(o.auth, o.pub); }

async function serializeState() {

  catch (e) { return false; }

  applyTheme();
  return true;
}
let S;
if (SBMODE) { let prefs = {}; try { prefs = JSON.parse(localStorage.getItem('tudo:prefs') || '{}'); } catch (e) {} S = emptyState(null, prefs); ENC.sealed = true; }
else { try { const ls = localStorage.getItem('daybook:v1'); if (ls) adoptStored(ls); else S = fresh(); } catch (e) { S = fresh(); } }
const V = { calMode: (typeof innerWidth !== 'undefined' && innerWidth <= 820) ? 'month' : 'week', view: 'tasks', f: { type: 'smart', id: 'today' }, sel: null, cal: today().slice(0, 7), calSel: today(), collapsed: { done: true }, sort: 'date' };
let store = { kind: 'local' }, saveTimer = null, syncText = 'Saved on this device';

function save() {
  if (SBMODE && !ENC.sealed) SB.dirty = true;
  if (typeof nativeSchedule === 'function') nativeSchedule();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    if (ENC.sealed) return;
    let str; try { str = await serializeState(); } catch (e) { return; }
    if (ENC.sealed) return;
    if (SBMODE) { if (SB.uid) await sbSaveState(str); return; }
    try { localStorage.setItem('daybook:v1', str); } catch (e) {}

function setSync(t) { syncText = t; const el = $('#sync'); if (el) el.textContent = t; }

async function initStore() {
  try {

    if (!db || !user) return;

    if (!id) return;

    const snap = await ref.get();
    if (snap.exists && snap.data().s) {

      adoptStored(snap.data().s);

/* ---------- task logic ---------- */
const listById = id => S.lists.find(l => l.id === id) || S.lists[0];
const live = () => S.tasks.filter(t => !t.deleted);
function nextDue(d, r) {
  if (!d) d = today();

  if (r === 'monthly') { const x = parseYmd(d); x.setMonth(x.getMonth() + 1); return ymd(x); }
  if (r === 'yearly') { const x = parseYmd(d); x.setFullYear(x.getFullYear() + 1); return ymd(x); }
  return d;
}
function toggleDone(id) {
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  const before = JSON.parse(JSON.stringify(S.tasks));
  if (!t.done) {
    t.done = true; t.doneAt = Date.now();
    const entryId = logAddTask(t);
    const undo = () => { S.tasks = before; logRemove(entryId); save(); renderAll(); };
    if (t.repeat) {
      S.tasks.push({ ...JSON.parse(JSON.stringify(t)), id: uid(), done: false, doneAt: null, due: nextDue(t.due, t.repeat), origDue: undefined, rolled: undefined, subs: t.subs.map(s => ({ ...s, id: uid(), d: false })), created: Date.now() });
      toast('Completed. Next one set for ' + fmtDate(nextDue(t.due, t.repeat)), undo);
    } else toast('Completed', undo);
  } else { logRemove(t.id + ':' + t.doneAt); t.done = false; t.doneAt = null; }
  save(); renderAll();
}
function delTask(id) {
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  if (t.deleted) { S.tasks = S.tasks.filter(x => x.id !== id); }
  else { t.deleted = true; toast('Moved to trash', () => { t.deleted = false; save(); renderAll(); }); }
  if (V.sel === id) V.sel = null;
  save(); renderAll();
}

/* Quick add format: [Today|Tmrw|weekday] [High|Med|Low] Task name
   Day and severity are read only from the start of the line, in either order; both are optional. */
const DAY_WORDS = { today: 0, tod: 0, tdy: 0, td: 0, tomorrow: 1, tmrw: 1, tmr: 1, tmw: 1, tom: 1, tomo: 1, tmro: 1 };
const WEEKDAYS = { sun: 0, sunday: 0, mon: 1, monday: 1, tue: 2, tues: 2, tuesday: 2, wed: 3, wednesday: 3, thu: 4, thur: 4, thurs: 4, thursday: 4, fri: 5, friday: 5, sat: 6, saturday: 6 };
const SEV_WORDS = { high: 3, hi: 3, h: 3, critical: 3, crit: 3, p1: 3, sev1: 3, '!1': 3, medium: 2, med: 2, m: 2, p2: 2, sev2: 2, '!2': 2, low: 1, lo: 1, l: 1, p3: 1, sev3: 1, '!3': 1, none: 0, p4: 0 };
function leadDay(w, w2) {
  const t = today();
  if (w in DAY_WORDS) return { due: addDays(t, DAY_WORDS[w]), used: 1 };
  if (w in WEEKDAYS) { const cur = parseYmd(t).getDay(); return { due: addDays(t, ((WEEKDAYS[w] - cur + 7) % 7) || 7), used: 1 }; }
  if (w === 'next' && (w2 === 'week' || w2 === 'wk')) { const d = parseYmd(t); return { due: addDays(t, ((8 - d.getDay()) % 7) || 7), used: 2 }; }
  return null;
}
function parseQuick(raw, defaults = {}) {
  let due = defaults.due ?? null, time = null, pri = defaults.pri ?? 0, tags = [], listId = defaults.listId || 'inbox';
  const t = today();
  const words = raw.trim().split(/\s+/).filter(Boolean);
  let gotDay = false, gotSev = false;
  for (let k = 0; k < 2; k++) {
    if (words.length < 2) break;
    const w = words[0].toLowerCase().replace(/[.,:;]+$/, ''), w2 = (words[1] || '').toLowerCase();
    const d = !gotDay && leadDay(w, w2);
    if (d) { due = d.due; gotDay = true; words.splice(0, d.used); continue; }
    if (!gotSev && w in SEV_WORDS) { pri = SEV_WORDS[w]; gotSev = true; words.shift(); continue; }
    break;
  }

const T = { mode: 'focus', running: false, endAt: 0, remain: null, taskId: '' };

      <div class="ctrls"><button class="btn" data-act="tgo">${T.running ? 'Pause' : (T.remain != null && T.remain < totalMs() ? 'Resume' : 'Start')}</button><button class="btn ghost" data-act="treset">Reset</button></div>
      <div style="display:flex;gap:14px;font-size:13px;color:var(--ink3);align-items:center">

      </div>

      <div class="stat"><span>Focus time today</span><b>${Math.floor(mins / 60)}h ${mins % 60}m</b></div>

function beep() { try { const a = new (window.AudioContext || window.webkitAudioContext)(); [0, .25, .5].forEach(t => { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(.15, a.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + t + .2); o.start(a.currentTime + t); o.stop(a.currentTime + t + .22); }); } catch (e) {} }

const gField = (id, label, type = 'password', extra = '') => `<label class="gfield"><span>${label}</span><input id="${id}" type="${type}" ${extra}></label>`;
function gCard(title, sub, body, foot = '') {
  return `<div class="gcard"><div class="gbrand"><span class="mark">${I.check}</span><b>Tudo</b></div><h1>${title}</h1>${sub ? `<p class="gsub">${sub}</p>` : ''}${body}<div class="gerr" id="gerr" role="alert"></div>${foot}</div>`;

      ${gField('gp2', 'Confirm passphrase', 'password', 'autocomplete="new-password" required')}<button class="gbtn">Continue</button></form>`,

}

  return null;

  const rep = { once: 'Once', daily: 'Every day', weekdays: 'Weekdays', custom: (al.days || []).slice().sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7)).map(i => DOW[i]).join(', ') || 'No days picked' }[al.repeat];

/* ---------- accounts (Supabase) ----------
   Supabase handles sign-up, sign-in, email confirmation, password reset and two-step codes.
   Task data is encrypted on the device (AES-256-GCM) before it is uploaded, with a data key wrapped by the
   account password and by recovery codes, so the database only ever holds ciphertext. */
const sbKey = k => 'tudo:' + SB.uid + ':' + k;

function sbMsg(e) {

  if (/invalid login credentials/i.test(m)) return 'Email or password is incorrect.';
  if (/email not confirmed/i.test(m)) return 'Confirm your email first. Check your inbox for the link we sent.';
  if (/rate limit|too many/i.test(m)) return 'Too many attempts. Wait a few minutes and try again.';
  if (/failed to fetch|network|load failed/i.test(m)) return "Can't reach the server. Check your internet connection.";
  if (/already registered|already been registered/i.test(m)) return 'An account with this email already exists. Sign in instead.';
  if (/password should be|weak password/i.test(m)) return 'Choose a longer, stronger password.';
  return m || 'Something went wrong. Try again.';
}
function sbInit() {
  if (SB.client || typeof supabase === 'undefined') return;

  SB.client = supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'implicit', storageKey: 'tudo-auth' } });
  SB.client.auth.onAuthStateChange((ev, session) => {
    if (session && session.user) { SB.user = session.user; SB.uid = session.user.id; }
    if (ev === 'PASSWORD_RECOVERY') { SB.recovery = true; if (AUTH.ready) gate('sb-newpass'); }
    if (ev === 'USER_UPDATED' && AUTH.unlocked) renderRail();
  });
}
async function sbNeedsMfa() { try { const { data } = await SB.client.auth.mfa.getAuthenticatorAssuranceLevel(); return !!(data && data.nextLevel === 'aal2' && data.currentLevel !== 'aal2'); } catch (e) { return false; } }

  try { const t = JSON.parse(localStorage.getItem(sbKey('trust')) || 'null'); if (t && t.until > Date.now() && t.dk) return t.dk; } catch (e) {}
  try { const s = JSON.parse(sessionStorage.getItem('tudo:unlock') || 'null'); const mins = S.settings.autoLock ?? 15; if (s && s.uid === SB.uid && s.dk && (!mins || Date.now() - s.at < mins * 60000)) return s.dk; } catch (e) {}

}
async function sbBoot() {

  sbInit();
  let session = null;
  try { session = (await SB.client.auth.getSession()).data.session; } catch (e) {}
  if (SB.recovery) return gate(session ? 'sb-newpass' : 'sb-signin');

  if (dk) { const r = await sbFetch(); if (r === 'ok') { await setDEK(b64d(dk)); if (await unseal()) return unlock(false); } ENC.raw = null; ENC.key = null; }

// Loads the newest encrypted state (server, or this device's unsynced copy). Leaves it sealed.
async function sbFetch() {
  let cache = null; try { cache = JSON.parse(localStorage.getItem(sbKey('state')) || 'null'); } catch (e) {}
  let remote = null, offline = false;
  SB.lastErr = '';
  try { const { data, error } = await SB.client.from('tudo_state').select('data, updated_at').eq('user_id', SB.uid).maybeSingle(); if (error) throw error; remote = data; }
  catch (e) {
    const m = (e && (e.message || e.details || e.hint)) || String(e);
    if (/failed to fetch|networkerror|load failed|network request failed/i.test(m)) offline = true;
    else { SB.lastErr = m + (e && e.code ? ' (' + e.code + ')' : ''); console.error('Tudo: loading data failed', e); return 'error'; }
  }
  let src = null, at = 0;
  if (remote) { src = remote.data; at = Date.parse(remote.updated_at) || 0; }
  if (cache && cache.s && ((!remote && (offline || cache.dirty)) || (cache.dirty && cache.at > at))) { src = cache.s; at = cache.at; SB.dirty = !!cache.dirty; }
  if (!src) return offline ? 'offline' : 'empty';
  const env = JSON.parse(src); ENV = env; ENC.sealed = true;

}
async function sbSaveState(str) {

  try {
    const { error } = await SB.client.from('tudo_state').upsert({ user_id: SB.uid, data: str, updated_at: new Date(at).toISOString() });
    if (error) throw error;
    SB.lastSync = at; SB.dirty = false;
    try { localStorage.setItem(sbKey('state'), JSON.stringify({ s: str, at, dirty: false })); } catch (e) {}
    setSync('Synced to your account');
  } catch (e) {

    clearTimeout(SB.retry); SB.retry = setTimeout(() => { if (SB.dirty && !ENC.sealed) save(); }, 15000);

}
// Pick up changes made on another device.
async function sbPull() {
  if (!SBMODE || !AUTH.unlocked || ENC.sealed || !SB.uid || SB.dirty || document.hidden) return;
  const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  try {
    const { data } = await SB.client.from('tudo_state').select('data, updated_at').eq('user_id', SB.uid).maybeSingle();
    if (!data) return; const at = Date.parse(data.updated_at) || 0; if (at <= SB.lastSync + 500 || SB.dirty) return;
    const env = JSON.parse(data.data), rest = JSON.parse(await decStr(env));

    LOG.months = {}; LOG.loaded = {}; renderAll(); if (typeof nativeSchedule === 'function') nativeSchedule();
  } catch (e) {}
}

// After the account password is known (sign-in, sign-up, password reset): open or create the data.
async function sbAfterAuth() {
  const pass = AUTH.pendingPass;
  gErr('Loading your data...');
  const r = await sbFetch();
  if (r === 'offline') { gErr("Can't reach the server and this device has no saved copy yet. Check your connection and try again."); return; }
  if (r === 'error') { gErr('The database refused the request: ' + SB.lastErr); return; }
  if (r === 'empty') return sbLegacy() ? gate('sb-import') : sbCreateVault();
  const raw = await unwrapDEK(pass, S.auth.wrap);
  if (!raw) return gate('sb-restore');
  await setDEK(raw);
  if (!(await unseal())) { gErr('Your data could not be decrypted. Try a recovery code.'); return gate('sb-restore'); }
  AUTH.pendingPass = null; const keep = AUTH.keep; AUTH.keep = false;
  unlock(keep);
}
async function sbCreateVault(keepState) {
  if (!keepState) S = fresh();
  S.settings = { ...S.settings };
  S.auth = { v: 3, sb: true, created: Date.now() };
  await setDEK(rand32());
  S.auth.wrap = await wrapDEK(AUTH.pendingPass);
  ENV = null; ENC.sealed = false;
  AUTH.pending = { codes: makeCodes(), sbFirst: true, keep: AUTH.keep };
  AUTH.pendingPass = null; AUTH.keep = false;
  gate('recovery');
}
// Data from before accounts existed (stored only on this device).
function sbLegacy() { try { return localStorage.getItem('daybook:v1'); } catch (e) { return null; } }

async function sbImport(oldPass) {
  const raw = sbLegacy(); if (!raw) return sbCreateVault();
  const o = JSON.parse(raw); let state, oldKey = null;
  if (o.enc) {
    if (!o.auth || !o.auth.wrap) throw new Error('This data cannot be read.');
    const k = await unwrapDEK(oldPass || '', o.auth.wrap);
    if (!k) throw new Error('That passphrase does not unlock the data on this device.');
    oldKey = await crypto.subtle.importKey('raw', k, 'AES-GCM', false, ['decrypt']);
    state = JSON.parse(await decStr(o, oldKey));

  SB_IMPORT_LOGS = {};
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i); if (!key || !key.startsWith('daybook:log:')) continue;
    const v = localStorage.getItem(key) || '';
    try { SB_IMPORT_LOGS[key.slice(12)] = v.startsWith('enc:') ? (oldKey ? JSON.parse(await decStr({ iv: v.split(':')[1], ct: v.split(':')[2] }, oldKey)) : []) : JSON.parse(v); } catch (e) {}
  }
  S = state; await sbCreateVault(true);
}
async function sbFinishImport() {
  if (!SB_IMPORT_LOGS) return;
  for (const m of Object.keys(SB_IMPORT_LOGS)) { LOG.months[m] = SB_IMPORT_LOGS[m]; LOG.loaded[m] = true; await logSave(m, SB_IMPORT_LOGS[m]); }
  SB_IMPORT_LOGS = null;
  try { for (let i = localStorage.length - 1; i >= 0; i--) { const k = localStorage.key(i); if (k && (k === 'daybook:v1' || k.startsWith('daybook:log:') || k === 'daybook:trust' || k === 'daybook:lockout')) localStorage.removeItem(k); } } catch (e) {}
  toast('Your existing tasks were moved into your account');
}

    g.innerHTML = gCard('Add an authenticator app', 'Scan this code with Google Authenticator, Microsoft Authenticator, Authy or any TOTP app, then enter the 6-digit code it shows.',
      `<div class="gqr"><div class="q"><img alt="QR code for your authenticator app" src="${esc(en.data.totp.qr_code)}"></div><div style="font-size:12px;color:var(--ink3)">Can't scan? Enter this key manually:<div class="gsecret">${esc(en.data.totp.secret.replace(/(.{4})/g, '$1 ').trim())}</div></div></div>
       <form data-step="sb-mfa-enroll">${gField('gcode', '6-digit code', 'text', 'inputmode="numeric" autocomplete="one-time-code" maxlength="7" class="code" required autofocus')}<button class="gbtn">Turn on</button></form>${cancel}`);
  } catch (e) { g.innerHTML = gCard('Two-step sign-in', sbMsg(e), cancel); }
}
async function sbClick(k) {
  if (k === 'sb-to-signup') return gate('sb-signup');
  if (k === 'sb-to-signin') return gate('sb-signin');
  if (k === 'sb-to-forgot') { const e = $('#gemail'); if (e) SB.email = e.value.trim(); return gate('sb-forgot'); }
  if (k === 'sb-to-restore') return gate('sb-restore');
  if (k === 'sb-signout') return sbSignOut();
  if (k === 'sb-resend') { try { const { error } = await SB.client.auth.resend({ type: 'signup', email: SB.email, options: { emailRedirectTo: sbSite() || undefined } }); if (error) throw error; toast('Confirmation email sent again'); } catch (e) { toast(sbMsg(e)); } return; }
  if (k === 'sb-skip-import') return sbCreateVault();
  if (k === 'sb-startover') { if (!confirm('Start over? Your previous tasks stay encrypted and cannot be recovered.')) return; return sbCreateVault(); }
  if (k === 'sb-mfa-off') { try { const { error } = await SB.client.auth.mfa.unenroll({ factorId: SB.factorId }); if (error) throw error; await SB.client.auth.refreshSession(); closeGate(); renderAll(); toast('Two-step sign-in turned off'); } catch (e) { toast(sbMsg(e)); } }
}
async function sbSubmit(step, f) {
  const v = id => (f.querySelector('#' + id) || {}).value || '';
  const newPass = () => { const p1 = v('gp1'), p2 = v('gp2'); if (p1.length < 10) { gErr('Use at least 10 characters.'); return null; } if (p1 !== p2) { gErr('The two passwords do not match.'); return null; } return p1; };
  if (step === 'sb-signin') {
    SB.email = v('gemail').trim(); gErr('Signing in...');
    const { data, error } = await SB.client.auth.signInWithPassword({ email: SB.email, password: v('gpass') });
    if (error) { gErr(sbMsg(error)); if (/not confirmed/i.test(error.message || '')) f.insertAdjacentHTML('afterend', '<button type="button" class="glink" data-g="sb-resend">Send the confirmation link again</button>'); return; }
    SB.user = data.user; SB.uid = data.user.id; AUTH.pendingPass = v('gpass'); AUTH.keep = f.querySelector('#gkeep').checked;
    if (await sbNeedsMfa()) return gate('sb-mfa');
    return sbAfterAuth();
  }
  if (step === 'sb-signup') {
    const p = newPass(); if (!p) return;
    SB.email = v('gemail').trim(); gErr('Creating your account...');
    const { data, error } = await SB.client.auth.signUp({ email: SB.email, password: p, options: { data: { name: v('gname').trim() }, emailRedirectTo: sbSite() || undefined } });
    if (error) { gErr(sbMsg(error)); return; }
    if (data.session) { SB.user = data.user; SB.uid = data.user.id; AUTH.pendingPass = p; return sbAfterAuth(); }
    return gate('sb-check-email');
  }
  if (step === 'sb-forgot') {
    SB.email = v('gemail').trim();
    const { error } = await SB.client.auth.resetPasswordForEmail(SB.email, { redirectTo: sbSite() || undefined });
    if (error) { gErr(sbMsg(error)); return; }
    $('#gate').innerHTML = gCard('Check your email', `If an account exists for <b>${esc(SB.email)}</b>, a link to reset the password is on its way. Open it on any device.`, '<button class="gbtn" type="button" data-g="sb-to-signin">Back to sign in</button>');
    return;
  }
  if (step === 'sb-newpass') {
    const p = newPass(); if (!p) return;
    const { data, error } = await SB.client.auth.updateUser({ password: p });
    if (error) { gErr(sbMsg(error)); return; }
    SB.recovery = false; history.replaceState(null, '', location.pathname + location.search);
    SB.user = data.user; SB.uid = data.user.id; AUTH.pendingPass = p;
    toast('Password changed');
    return sbAfterAuth();
  }
  if (step === 'sb-mfa' || step === 'sb-mfa-enroll') {
    let fid = SB.factorId;
    if (step === 'sb-mfa') { const { data } = await SB.client.auth.mfa.listFactors(); const fa = (data.totp || []).find(x => x.status === 'verified'); fid = fa && fa.id; }
    const { error } = await SB.client.auth.mfa.challengeAndVerify({ factorId: fid, code: v('gcode').replace(/\s/g, '') });
    if (error) { gErr('That code did not match. Use the newest code from your app.'); return; }
    if (step === 'sb-mfa-enroll') { closeGate(); renderAll(); toast('Two-step sign-in is on'); return; }
    if (AUTH.pendingPass) return sbAfterAuth();
    return sbBoot();
  }
  if (step === 'sb-unlock') {
    if (AUTH.lockUntil > Date.now()) return;
    const pass = v('gpass'); gErr('Unlocking...');
    if (!ENV || !S.auth) { const r = await sbFetch(); if (r === 'offline') { gErr("Can't reach the server and this device has no saved copy."); return; } if (r === 'error') { gErr('The database refused the request: ' + SB.lastErr); return; } if (r === 'empty') { AUTH.pendingPass = pass; AUTH.keep = f.querySelector('#gkeep').checked; return sbLegacy() ? gate('sb-import') : sbCreateVault(); } }
    const raw = await unwrapDEK(pass, S.auth.wrap);
    if (raw) { await setDEK(raw); if (await unseal()) return unlock(f.querySelector('#gkeep').checked); }
    // Not this device's copy? The password may have changed elsewhere: check with the server.
    const chk = await SB.client.auth.signInWithPassword({ email: SB.user.email, password: pass });
    if (!chk.error) { AUTH.pendingPass = pass; AUTH.keep = f.querySelector('#gkeep').checked; ENV = null; return sbAfterAuth(); }
    AUTH.fails++; if (AUTH.fails >= 5) AUTH.lockUntil = Date.now() + Math.min(3600, 30 * Math.pow(2, AUTH.fails - 5)) * 1000; saveLockout();
    if (AUTH.lockUntil > Date.now()) return gate('sb-unlock');
    gErr('That password is incorrect.'); return;
  }
  if (step === 'sb-restore') {
    const val = v('grest'); gErr('Checking...');
    if (!ENV) { const r = await sbFetch(); if (r !== 'ok') { gErr("Can't load your data right now."); return; } }
    let raw = await unwrapDEK(val, S.auth.wrap), used = -1;
    if (!raw) for (let i = 0; i < (S.auth.rec || []).length; i++) { const r = S.auth.rec[i]; if (!r.ct) continue; raw = await unwrapDEK(normCode(val), r); if (raw) { used = i; break; } }
    if (!raw) { gErr('That is not your previous password or a valid recovery code.'); return; }
    await setDEK(raw); if (!(await unseal())) { gErr('Your data could not be decrypted.'); return; }
    if (used >= 0) S.auth.rec.splice(used, 1);
    if (AUTH.pendingPass) { S.auth.wrap = await wrapDEK(AUTH.pendingPass); AUTH.pendingPass = null; }
    const keep = AUTH.keep; AUTH.keep = false; unlock(keep);
    toast(used >= 0 ? 'Unlocked with a recovery code. ' + S.auth.rec.length + ' codes left.' : 'Your data is unlocked with your new password.');
    return;
  }
  if (step === 'sb-import') { gErr('Moving your tasks...'); return sbImport(v('gold')); }
  if (step === 'sb-changepass') {
    const p = newPass(); if (!p) return;
    const chk = await SB.client.auth.signInWithPassword({ email: SB.user.email, password: v('gcur') });
    if (chk.error) { gErr('Current password is incorrect.'); return; }
    const { error } = await SB.client.auth.updateUser({ password: p });
    if (error) { gErr(sbMsg(error)); return; }
    S.auth.wrap = await wrapDEK(p); save();
    try { localStorage.removeItem(sbKey('trust')); } catch (e) {}
    closeGate(); renderAll(); toast('Password changed'); return;
  }
  if (step === 'sb-delete') {
    if (v('gconfirm').trim() !== 'DELETE') { gErr('Type DELETE in capital letters to confirm.'); return; }
    const chk = await SB.client.auth.signInWithPassword({ email: SB.user.email, password: v('gcur') });
    if (chk.error) { gErr('That password is incorrect.'); return; }
    const { error } = await SB.client.rpc('delete_my_account');
    if (error) { gErr(sbMsg(error)); return; }
    const pf = 'tudo:' + SB.uid + ':';
    try { for (let i = localStorage.length - 1; i >= 0; i--) { const k = localStorage.key(i); if (k && k.startsWith(pf)) localStorage.removeItem(k); } } catch (e) {}
    await sbSignOut(); toast('Your account and data were deleted'); return;
  }
}

function applyTheme() {
  const r = document.documentElement, th = S.settings.theme || 'auto';
  if (th === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', th);
  const acc = S.settings.accent;
  if (acc && /^#[0-9a-f]{6}$/i.test(acc)) {
    const n = parseInt(acc.slice(1), 16), lum = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
    r.style.setProperty('--accent', acc); r.style.setProperty('--accentInk', lum > 0.62 ? '#111418' : '#FFFFFF');
  } else { r.style.removeProperty('--accent'); r.style.removeProperty('--accentInk'); }
  if (S.settings.font === 'system') r.style.setProperty('--font', 'system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif');
  else if (S.settings.font === 'onest') r.style.setProperty('--font', '"Onest",system-ui,sans-serif');
  else r.style.removeProperty('--font');
}
const ACCENTS = ['#2740CB', '#13A8B1', '#843CF3', '#C80B92', '#018102', '#D98A0A', '#D75054', '#3A3B3E'];
function settingsPop(anchor) {
  closeLayers();
  const el = document.createElement('div'); el.className = 'ctx setpop'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Appearance');
  const draw = () => {
    const cur = S.settings.accent || '', f = S.settings.font || 'inter', th = S.settings.theme || 'auto';
    el.innerHTML = `<div class="mlabel">Accent color</div><div class="swatches"><button data-acc="" class="${!cur ? 'on' : ''}" aria-label="Default accent" style="background:conic-gradient(#2740CB 0 50%,#22D3EE 0)"></button>${ACCENTS.slice(1).map(c => `<button style="background:${c}" data-acc="${c}" class="${cur === c ? 'on' : ''}" aria-label="Accent ${c}"></button>`).join('')}<input type="color" id="acccustom" value="${cur || '#2740CB'}" aria-label="Pick any accent color" title="Pick any color" style="width:28px;height:28px;border:0;padding:0;background:none;cursor:pointer"></div>
      <div class="mlabel">Font</div>${[['inter', 'Inter'], ['onest', 'Onest'], ['system', 'System default']].map(([k, n]) => `<button data-font="${k}">${f === k ? '✓ ' : ''}${n}</button>`).join('')}
      <div class="mlabel">Tasks</div><button data-roll="1">${S.settings.rollover !== false ? '✓ ' : ''}Move unfinished tasks to the next day</button>
      <button data-keep="1">Keep work log: ${keepLabel()}</button>
      <div class="mlabel">Theme</div>${[['auto', 'Match system'], ['light', 'Light'], ['dark', 'Dark']].map(([k, n]) => `<button data-th="${k}">${th === k ? '✓ ' : ''}${n}</button>`).join('')}
      ${!NATIVE && !window.claude ? `<div class="mlabel">Apps</div><button data-sec="android">Get the Android app</button>` : ''}
      ${SBMODE ? sbSettingsHTML() : S.auth ? `<div class="mlabel">Security</div>
      <button data-sec="autolock">Auto-lock: ${(S.settings.autoLock ?? 15) ? 'after ' + (S.settings.autoLock ?? 15) + ' min idle' : 'off'}</button>
      <button data-sec="change">Change passphrase</button>
      <button data-sec="${S.auth.totp ? 'totp-off' : 'totp-enable'}">${S.auth.totp ? 'Turn off authenticator app' : 'Set up authenticator app'}</button>
      <button data-sec="newcodes">New recovery codes (${(S.auth.rec || []).length} left)</button>
      <button data-sec="signout">Sign out on this device</button>` : ''}`;
  };
  draw();
  const r = anchor.getBoundingClientRect();
  el.style.left = Math.max(8, Math.min(r.left - 120, innerWidth - 280)) + 'px'; el.style.top = (r.top < innerHeight / 2 ? r.bottom + 6 : Math.max(8, r.top - 380)) + 'px';
  $('#layer').appendChild(el);
  const apply = () => { applyTheme(); save(); draw(); };
  el.addEventListener('click', e => {
    e.stopPropagation();
    const b = e.target.closest('button'); if (!b) return;
    if ('acc' in b.dataset) S.settings.accent = b.dataset.acc || '';
    if (b.dataset.font) S.settings.font = b.dataset.font;
    if (b.dataset.th) S.settings.theme = b.dataset.th;
    if (b.dataset.keep) { const o = [6, 12, 24, 0], c = keepMonths(); S.settings.keepMonths = o[(o.indexOf(c) + 1) % o.length]; save(); draw(); if (V.view === 'log') renderMain(); return; }
    if (b.dataset.roll) { S.settings.rollover = S.settings.rollover === false; save(); draw(); if (S.settings.rollover) renderAll(); return; }
    if (b.dataset.sec) {
      const k = b.dataset.sec;
      if (k === 'android') { location.href = 'download'; return; }
      if (k.startsWith('sb-')) { if (k === 'sb-autolock') { const opts = [5, 15, 30, 60, 0], cur = S.settings.autoLock ?? 15; S.settings.autoLock = opts[(opts.indexOf(cur) + 1) % opts.length]; save(); draw(); return; } el.remove(); return sbSetting(k); }
      if (k === 'autolock') { const opts = [5, 15, 30, 60, 0], cur = S.settings.autoLock ?? 15; S.settings.autoLock = opts[(opts.indexOf(cur) + 1) % opts.length]; save(); draw(); return; }
      el.remove();
      if (k === 'signout') { try { localStorage.removeItem('daybook:trust'); } catch (x) {} lockApp(); return; }
      if (k === 'newcodes') { AUTH.pending = { codes: makeCodes(), manage: true }; return gate('recovery', true); }
      if (k === 'totp-enable') { AUTH.pending = { totp: newTotpSecret(), manage: true }; return gate('totp-setup', true); }
      return gate(k, true);
    }
    apply();
  });
  el.addEventListener('input', e => { if (e.target.id === 'acccustom') { S.settings.accent = e.target.value; applyTheme(); save(); } });
  el.addEventListener('change', e => { if (e.target.id === 'acccustom') draw(); });
  setTimeout(() => document.addEventListener('click', function h(ev) { if (!el.contains(ev.target)) { el.remove(); document.removeEventListener('click', h); } }), 0);
}

/* refresh day boundaries */
let lastDay = today();
setInterval(() => { if (today() !== lastDay) { lastDay = today(); renderAll(); } }, 60000);

applyTheme(); renderAll(); gate('loading');
let authDecided = false;
const decideAuth = () => { if (authDecided) return; authDecided = true; if (SBMODE) sbBoot(); else authReady(); setTimeout(checkAlerts, 500); setTimeout(logMaintain, 1500); };
if (NATIVE) { syncText = SBMODE ? 'Synced to your account' : 'Saved on this phone'; nativeInit(); }
if (SBMODE) { syncText = 'Synced to your account'; sbInit(); }
setTimeout(decideAuth, 6000);
initStore().finally(decideAuth);
</script>
